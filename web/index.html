<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Naive_DDPG 算法车辆运行模拟</title>
  <link rel="stylesheet" href="styles.css?v=20251214">
  <!-- 高德地图 JS API -->
  <script>window._AMapSecurityConfig = { securityJsCode: 'f1429ace3a567dba843043d54270ed2d' };</script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=a554d1e1748687479074aaaf9b5d5000"></script>
</head>
<body>
  <div class="app">
    <div id="loading" class="loading-overlay" aria-hidden="false">
      <div class="loading-content">
        <div class="spinner"></div>
        <div class="loading-text">正在加载数据，请稍候…</div>
      </div>
    </div>
    <header class="app-header">
      <div class="title">Naive_DDPG 算法车辆运行模拟</div>
      <div class="episode" id="episodeText">Episode -</div>
      <div class="controls">
        <button id="btnToggle" class="btn primary">开始模拟</button>
        <button id="btnSidebar" class="btn">状态栏</button>
        <label class="speed-label">速度
          <input id="speedRange" type="range" min="0.25" max="10" step="0.25" value="1">
          <span id="speedText">1x</span>
        </label>
        <div class="seek">
          <input id="seekRange" type="range" min="0" max="100" step="1" value="0">
          <span id="clock">--:-- / --:--</span>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="side left-panel" id="leftPanel" data-info="bus">
        <div class="card stats-card" id="statsCard">
          <div class="card-title">运行概览</div>
          <div class="stats-grid" role="list">
            <div class="stat" role="listitem">
              <div class="stat-label">车辆数</div>
              <div class="stat-value" id="statBus">-</div>
            </div>
            <div class="stat" role="listitem">
              <div class="stat-label">平均速度</div>
              <div class="stat-value"><span id="statSpeed">-</span><span class="unit"> km/h</span></div>
            </div>
            <div class="stat" role="listitem">
              <div class="stat-label">乘客总数</div>
              <div class="stat-value" id="statPax">-</div>
            </div>
            <div class="stat" role="listitem">
              <div class="stat-label">仿真时长</div>
              <div class="stat-value"><span id="statDuration">-</span><span class="unit"> min</span></div>
            </div>
          </div>
        </div>
        <div class="panel-tabs" role="tablist" aria-label="信息切换">
          <button id="tabBus" class="tab-btn" role="tab" aria-controls="busCard" aria-selected="true">车辆信息</button>
          <button id="tabStop" class="tab-btn" role="tab" aria-controls="stopCard" aria-selected="false">站点信息</button>
        </div>
        <div class="card bus-card" id="busCard">
          <div class="card-title">车辆信息</div>
          <ul id="busList" class="bus-list"></ul>
        </div>
        <div class="card stop-card" id="stopCard">
          <div class="card-title">站点信息</div>
          <ul id="stopList" class="bus-list"></ul>
        </div>
      </aside>
      <section class="map-panel">
        <div id="map" class="map"></div>
      </section>
      
    </main>
  </div>

  <script src="app.js?v=20251214"></script>
</body>
</html>
