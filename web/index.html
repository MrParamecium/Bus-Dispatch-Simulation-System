<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>公交车真实数据可视化（Episode 50）</title>
  <link rel="stylesheet" href="styles.css">
  <!-- 高德地图 JS API -->
  <script>window._AMapSecurityConfig = { securityJsCode: 'f1429ace3a567dba843043d54270ed2d' };</script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=a554d1e1748687479074aaaf9b5d5000"></script>
</head>
<body>
  <div class="app">
    <div id="loading" class="loading-overlay" aria-hidden="false">
      <div class="loading-content">
        <div class="spinner"></div>
        <div class="loading-text">正在加载数据，请稍候…</div>
      </div>
    </div>
    <header class="app-header">
      <div class="title">公交车真实数据可视化</div>
      <div class="episode">Episode 50</div>
      <div class="controls">
        <button id="btnPlay" class="btn primary">播放</button>
        <button id="btnPause" class="btn">暂停</button>
        <label class="speed-label">速度
          <input id="speedRange" type="range" min="0.25" max="10" step="0.25" value="1">
          <span id="speedText">1x</span>
        </label>
        <div class="seek">
          <input id="seekRange" type="range" min="0" max="100" step="1" value="0">
          <span id="clock">--:-- / --:--</span>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="map-panel">
        <div id="map" class="map"></div>
      </section>
      
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
